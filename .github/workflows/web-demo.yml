name: Complete phone web demo
on:
  push:
    branches: [main, codex/hackathon-web-demo, codex/web-parity-demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: demo/requirements.txt
      - run: npm ci
      - run: npm run build:demo
      - run: pip install -r demo/requirements.txt
      - run: npm run test:demo
      - run: python -c "from demo.inference import Detector; from PIL import Image; results,latency=Detector().detect(Image.open('designs/desk-reference.jpg').convert('RGB')); assert any(r['label']=='cup' for r in results); print('Original model cup detection passed:',latency,'ms')"
      - run: docker build -t iseeyou-demo .
      - run: |
          docker run -d --name iseeyou-demo -p 7860:7860 iseeyou-demo
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health | python -c 'import json,sys; assert json.load(sys.stdin)["model_ready"]'; then
              curl -fsS http://127.0.0.1:7860/ | grep -q camera-stage
              exit 0
            fi
            sleep 2
          done
          docker logs iseeyou-demo
          exit 1
      - run: python scripts/package-demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: I-SEE-YOU-complete-web-demo
          path: output/hackathon/*.zip
          retention-days: 14
