[build]
  command = "node scripts/build-netlify.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"
  # The provider region is a public routing label, not a credential.
  # Keep provider-key scanning enabled.
  SECRETS_SCAN_OMIT_KEYS = "DASHSCOPE_REGION"

[[redirects]]
  from = "/memory"
  to = "/video/"
  status = 301
  force = true

[[redirects]]
  from = "/memory/"
  to = "/video/"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/video/"
  status = 302
  force = true
